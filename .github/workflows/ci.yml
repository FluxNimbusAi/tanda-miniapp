name: CI

# Honest-green web gate: install (npm ci, lockfile-pinned), typecheck,
# unit tests when a suite exists on the ref, and a production build.
#
# Scope notes (2026-11-17):
# - No prettier gate yet: main carries a pre-existing format backlog from
#   the upstream template; a repo-wide reformat would collide with open
#   branches. Tracked separately.
# - Unit tests: vitest suite (P0.3 seat-badge lane, t_44ae186c) —
#   `npm test` runs resolver + SeatBadge render + /api/seat-grants
#   SQLite integration (35 cases). Suites authored with node:test
#   (e.g. P1.4a settlement-vector) must be ported to vitest or added
#   as an explicit step; a bare `node --test` glob no longer covers
#   the repo's test story.
# - next build runs with no env: all World/Minikit env reads are
#   request-time, verified locally 2026-11-17.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install (lockfile-pinned)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # Hosting Plan B (ADR-0009): the PC host has no docker daemon, so CI is the
  # production image's proving ground. The image must build from
  # hosting/Dockerfile and the standalone container must serve the landing
  # page with ZERO env — same expectation verified locally 2026-11-19
  # (node .next/standalone/server.js -> GET / == 200, no AUTH_SECRET needed).
  docker-build:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f hosting/Dockerfile -t tanda-miniapp:ci .

      - name: Smoke test container
        run: |
          docker run -d --rm --name tanda-smoke -p 3000:3000 tanda-miniapp:ci
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET / -> HTTP $code"
          if [ "$code" != "200" ]; then docker logs tanda-smoke; exit 1; fi
          docker rm -f tanda-smoke
